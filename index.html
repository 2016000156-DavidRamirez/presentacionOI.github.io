idth .25s ease}.controls{position:fixed;right:22px;bottom:18px;z-index:80;display:flex;gap:10px}.btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);color:white;border-radius:999px;min-width:44px;height:44px;padding:0 14px;font-weight:950;cursor:pointer;backdrop-filter:blur(14px)}.count{position:fixed;left:22px;bottom:30px;color:white;font-size:13px;font-weight:950;letter-spacing:.12em;z-index:80}@media(max-width:900px){body{overflow:auto}.stage{height:auto;min-height:100vh}.deck{width:100vw;height:auto;min-height:100vh}.slide{position:relative;min-height:100vh}.content,.cover .content{position:relative;left:auto;right:auto;top:auto;bottom:auto;padding:140px 24px 90px;grid-template-columns:1fr}.copy{padding-left:0}.num{left:24px;top:120px}.top{left:24px;right:24px}.docpill{display:none}.visual{min-height:300px}h1,.cover h1{font-size:38px}.cards,.matrix,.flowDiagram{grid-template-columns:1fr}.footer{left:24px;right:24px}}

": "Acceso, limpieza, identificación, torque, tierra, protección mecánica y registros de prueba.", "hold": "No se energiza ningún sistema sin tierra, unión equipotencial, torque, aislamiento, continuidad, identificación y autorización.", "evidence": "Lista de no conformidad, punch list, protocolos corregidos y registro fotográfico.", "criteria": "Toda condición crítica debe corregirse y quedar documentada antes de liberar."}, {"img": "slide-06-matriz-nec.jpg", "kicker": "Matriz NEC 2017", "title": "La matriz normativa traduce el código a revisión práctica de campo", "statement": "Cada actividad se relaciona con artículos de referencia para que supervisión y calidad revisen con criterio común.", "bullets": ["Art. 110: instalación, identificación y espacios de trabajo", "Art. 250: puesta a tierra y unión equipotencial", "Art. 300: métodos de alambrado y protección", "Art. 310: conductores y selección", "Art. 392: charolas portacables", "Art. 430: motores y controladores"], "verify": "Actividad de campo, artículo de referencia y aplicación práctica en Opción Industrial.", "hold": "Cuando la actividad no se pueda relacionar con un criterio técnico, se detiene y se consulta.", "evidence": "Matriz de aplicación, checklist de supervisión y observaciones de QA/QC.", "criteria": "La inspección se vuelve consistente, repetible y auditable."}, {"img": "slide-07-responsabilidades.jpg", "kicker": "Responsabilidades por etapa", "title": "Los roles separan ejecución, supervisión, coordinación y liberación", "statement": "El manual define quién ejecuta, apoya, supervisa, coordina y libera cada etapa para evitar ambigüedad en campo.", "bullets": ["Eléctrico: ejecuta instalación y correcciones", "Auxiliar: apoya medición, orden e identificación", "Supervisor: valida método y secuencia", "Encargado: coordina cliente, recursos y permisos", "Calidad: inspecciona, registra y libera"], "verify": "Etapa, responsable, entregable y límite de autorización.", "hold": "Calidad no libera sin evidencia objetiva y responsable definido.", "evidence": "Matriz de responsabilidades, bitácora, checklists, protocolos y actas.", "criteria": "Cada liberación tiene dueño, evidencia y trazabilidad."}, {"img": "slide-08-flujo-retencion.jpg", "kicker": "Flujo maestro", "title": "Los puntos de retención bloquean fases sin liberación técnica", "statement": "La instalación avanza por fases: revisión, trazado, canalización, cableado, terminación, verificación, energización y puesta en marcha.", "bullets": ["Revisión documental", "Trazado y segregación", "Canalización y soportes", "Cableado y terminación", "Verificación previa", "Energización controlada", "Puesta en marcha y aceptación"], "verify": "Entrada obligatoria, actividad principal y salida de liberación por fase.", "hold": "No se permite pasar de fase sin liberación documentada.", "evidence": "Plan de trabajo, registros OI-QC, matriz de avance y actas de liberación.", "criteria": "La inspección visual no reemplaza pruebas eléctricas ni control documental."}, {"img": "slide-09-seguridad-loto.jpg", "kicker": "Seguridad eléctrica", "title": "El acceso seguro y el bloqueo/etiquetado controlan el riesgo antes de intervenir", "statement": "La seguridad inicia antes de tocar el equipo: energía controlada, área limpia, permiso vigente y responsables presentes.", "bullets": ["Permiso de trabajo aprobado", "Análisis de riesgo comunicado", "Área sin obstrucciones frente a tableros", "Bloqueo y etiquetado cuando aplique", "Verificación de ausencia de tensión"], "verify": "Permisos, área, energía, EPP, herramienta e identificación de fuentes.", "hold": "No iniciar si el área está energizada sin control, obstruida o sin permiso.", "evidence": "Permiso, bitácora, análisis de riesgo y checklist de seguridad.", "criteria": "Intervención autorizada, segura y documentada."}, {"img": "slide-10-planos-campo.jpg", "kicker": "Planos y levantamiento", "title": "La instalación no inicia con planos preliminares o información incompleta", "statement": "Antes de marcar o montar se confirman documentos vigentes, cargas, tableros, rutas, equipos, identificaciones e interferencias.", "bullets": ["Planos aprobados y revisión vigente", "Lista de motores y entradas/salidas", "Ubicación real de tableros y equipos", "Interferencias revisadas", "Cambios elevados a ingeniería"], "verify": "Revisión documental, identificación, ruta y condición real de campo.", "hold": "No liberar instalación si el plano no está vigente o la identificación no coincide.", "evidence": "Control documental, registro de interferencias, reportes de avance y as-built si aplica.", "criteria": "Información liberada antes de marcar, perforar o instalar."}, {"img": "slide-11-trazado-canalizacion.jpg", "kicker": "Trazado y canalización", "title": "La ruta eléctrica define protección, mantenibilidad y confiabilidad", "statement": "El trazado debe proteger conductores, permitir mantenimiento y respetar segregación de fuerza, control, instrumentación y comunicación.", "bullets": ["Ruta completa revisada antes de instalar", "Puntos de soporte, cajas y halado marcados", "Separación de circuitos definida", "Canalización sin rebabas ni bordes cortantes", "Cajas accesibles y protegidas"], "verify": "Método de alambrado, protección mecánica, radios, cajas, soporte y separación.", "hold": "No cablear si la canalización no está inspeccionada y liberada.", "evidence": "OI-CL-001, checklist maestro, bitácora y registro fotográfico.", "criteria": "Canalización limpia, soportada, accesible y segura para recibir conductores."}, {"img": "slide-12-soporteria-charolas.jpg", "kicker": "Soportería y gabinetes", "title": "Soportes, cajas, gabinetes y charolas forman parte del sistema eléctrico", "statement": "Una falla mecánica puede convertirse en falla eléctrica; por eso cada elemento debe quedar firme, accesible, protegido e identificado.", "bullets": ["Gabinetes firmes y con acceso", "Cajas con tapa y volumen adecuado", "Charolas soportadas y sin deformación", " let lang='es', current=0; const imgBase='assets/img/';
function bulletHTML(items){return (items||[]).map(x=>`<div class="bullet"><span class="check">✓</span><span>${x}</span></div>`).join('')}
function cards(s){return `<div class="cards"><div class="card"><h3>${lang==='es'?'Qué se verifica':'What is verified'}</h3><p>${s.verify}</p></div><div class="card hold"><h3>${lang==='es'?'Punto de retención':'Hold point'}</h3><p>${s.hold}</p></div><div class="card evid"><h3>${lang==='es'?'Evidencia generada':'Generated evidence'}</h3><p>${s.evidence}</p></div><div class="card crit"><h3>${lang==='es'?'Criterio de aceptación':'Acceptance criteria'}</h3><p>${s.criteria}</p></div></div>`}
function specialContent(s,i){
 if(i===4 || i===5) return `<div class="matrix">${s.bullets.map(b=>`<div class="mitem"><b>${b.split(':')[0]}</b><span>${b.includes(':')?b.split(':').slice(1).join(':'):b}</span></div>`).join('')}</div>`;
 if(i===7) return `<div class="flowDiagram">${s.bullets.map((b,k)=>`<div class="step"><b>${String(k+1).padStart(2,'0')}</b><span>${b}</span></div>`).join('')}</div>`;
 return `<div class="bullets">${bulletHTML(s.bullets)}</div>`;
}

    sec.innerHTML=`<div class="bg" style="background-image:url('${imgBase+s.img}')"></div><div class="watermark"></div><div class="rule"></div><div class="top"><div class="brand"><img src="assets/img/logo-opcion-industrial-isotipo.png"><div><b>Opción Industrial</b><span>Ingeniería Mecánica & Eléctrica</span></div></div><div class="docpill">OI-WI-001 | REV-16<br>${lang==='es'?'Documento controlado':'Controlled document'}</div></div><div class="content"><div class="copy"><span class="kicker">${s.kicker}</span><h1>${s.title.replace('Eléctrica Industrial','<span class="red">Eléctrica Industrial</span>').replace('Electrical Installation','<span class="red">Electrical Installation</span>')}</h1><p class="statement">${s.subtitle}<br><strong>${s.statement}</strong></p><div class="coverMeta"><div><b>OI-WI-001</b><span>Código</span></div><div><b>REV-16</b><span>${lang==='es'?'Revisión':'Revision'}</span></div><div><b>20/05/2021</b><span>${lang==='es'?'Referencia':'Reference'}</span></div><div><b>NFPA 70</b><span>NEC 2017</span></div></div><div class="bullets">${bulletHTML(s.bullets)}</div></div><div class="visual"><img src="${imgBase+s.img}"></div></div><div class="footer"><span>Manual de instalación eléctrica industrial</span><span>Opción Industrial · Estándar interno oficial</span></div><div class="progress"><span style="width:${pct}%"></span></div>`;
  } else {
    sec.innerHTML=`<div class="bg" style="background-image:url('${imgBase+s.img}')"></div><div class="top"><img class="innerLogo" src="assets/img/logo-opcion-industrial.png"><div class="docpill">OI-WI-001 | REV-16<br>${lang==='es'?'Manual general para proyectos eléctricos':'General manual for electrical projects'}</div></div><div class="num">${String(i+1).padStart(2,'0')}</div><div class="content"><div class="copy"><span class="kicker">${s.kicker}</span><h1>${s.title}</h1><p class="statement">${s.statement}</p>${specialContent(s,i)}${cards(s)}</div><div class="visual"><img src="${imgBase+s.img}"></div></div><div class="footer"><span>OI-WI-001 · Manual de instalación eléctrica industrial</span><span>${lang==='es'?'Aplicable a todos los proyectos':'Applicable to all projects'}</span></div><div class="progress"><span style="width:${pct}%"></span></div>`;
  }
  deck.appendChild(sec);
 });
 document.getElementById('count').textContent=`${String(current+1).padStart(2,'0')} / ${String(SLIDES[lang].length).padStart(2,'0')}`;
 document.getElementById('langBtn').textContent=lang==='es'?'EN':'ES';
}
function go(n){current=Math.max(0,Math.min(SLIDES[lang].length-1,current+n));render()}
function toggleLang(){lang=lang==='es'?'en':'es';render()}
function full(){const el=document.querySelector('.deck'); if(!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); if(e.key==='Home'){current=0;render()} if(e.key==='End'){current=SLIDES[lang].length-1;render()} });
document.querySelector('.deck')?.addEventListener('click',e=>{ if(e.clientX>window.innerWidth/2)go(1); else go(-1); });
render();
</script>
</body>
</html>
